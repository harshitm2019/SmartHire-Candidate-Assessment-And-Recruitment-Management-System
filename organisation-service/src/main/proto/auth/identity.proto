syntax = "proto3";

package auth;

option java_multiple_files = true;
option java_package = "com.proto.auth";
option java_outer_classname = "IdentityProto";

service IdentityService {

  rpc CreateIdentity(CreateIdentityRequest)
      returns (CreateIdentityResponse);
}

message CreateIdentityRequest {


  string email = 1;

  string password = 2;

  string displayName = 3;

  repeated string role = 4;
}

message CreateIdentityResponse {

  int64 userId = 1;
}